# ==================== 开发环境配置 ====================
# 使用方式: 设置环境变量或在下面替换占位符
#   PG_PASSWORD=你的密码
#   JWT_SECRET=你的Base64密钥

spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:ai_document_platform}?currentSchema=public
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:postgres123}

  jpa:
    show-sql: true

