spring:
  application:
    name: AiDocumentPlatform
  profiles:
    active: dev,openai

  # ==================== 数据库 (PostgreSQL) ====================
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:ai_document_platform}?currentSchema=public
    driver-class-name: org.postgresql.Driver
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:postgres123}

  # ==================== JPA ====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai

  # ==================== 文件上传 ====================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # ==================== Jackson ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ==================== 服务端口 ====================
server:
  port: ${SERVER_PORT:8080}

# ==================== 应用自定义配置 ====================
app:
  jwt:
    secret: ${JWT_SECRET:YWlEb2N1bWVudFBsYXRmb3JtU2VjcmV0S2V5Rm9ySldUU2lnbmluZzIwMjQ=}
    expiration-ms: ${JWT_EXPIRATION:86400000}  # 默认24小时
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai:
    api-url: ${AI_API_URL:https://api.anthropic.com/v1/messages}
    api-key: ${AI_API_KEY:请替换为你的AI_API_KEY}
    model: ${AI_MODEL:claude-sonnet-4-20250514}
  # Mermaid → PNG（Word 导出兜底；前端失败或文档列表直接 GET 导出时使用）
  mermaid:
    enabled: ${MERMAID_ENABLED:true}
    kroki-url: ${MERMAID_KROKI_URL:https://kroki.io}
