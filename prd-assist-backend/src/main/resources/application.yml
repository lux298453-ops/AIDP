spring:
  application:
    name: AiDocumentPlatform
  profiles:
    active: dev,openai

  # ==================== 数据库 (PostgreSQL) ====================
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:ai_document_platform}?currentSchema=public
    driver-class-name: org.postgresql.Driver
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:postgres123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ==================== JPA ====================
  jpa:
    # 实体无关联映射，不依赖视图层懒加载；关闭 OSIV 避免请求期间长期占用数据库连接
    open-in-view: false
    hibernate:
      # 生产部署建议设 JPA_DDL_AUTO=validate，配合迁移脚本管理表结构
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai

  # ==================== 文件上传 ====================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # ==================== Jackson ====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ==================== 服务端口 ====================
server:
  port: ${SERVER_PORT:8080}

# ==================== 应用自定义配置 ====================
app:
  cors:
    # 开发/临时演示默认允许 localhost 和常见局域网地址；正式部署建议用环境变量收紧为实际域名。
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.*.*.*:[*]}
  jwt:
    secret: ${JWT_SECRET:YWlEb2N1bWVudFBsYXRmb3JtU2VjcmV0S2V5Rm9ySldUU2lnbmluZzIwMjQ=}
    expiration-ms: ${JWT_EXPIRATION:86400000}  # 默认24小时
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai:
    api-url: ${AI_API_URL:https://api.anthropic.com/v1/messages}
    api-key: ${AI_API_KEY:请替换为你的AI_API_KEY}
    model: ${AI_MODEL:claude-sonnet-4-20250514}
  # Mermaid → PNG（本地 mmdc 渲染）
  mermaid:
    enabled: ${MERMAID_ENABLED:true}
