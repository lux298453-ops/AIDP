# OpenAI API 配置
# 激活方式：
#   spring.profiles.active=dev,openai
#
# 必填环境变量：
#   AI_API_KEY=你的 OpenAI API Key
#
# 可选环境变量：
#   AI_MODEL=gpt-5.5
#   AI_MAX_OUTPUT_TOKENS=16384
#   AI_IMAGE_DETAIL=high

app:
  http:
    # Some relay/proxy/TUN combinations corrupt TLS 1.3 streams in Reactor Netty
    # and surface as "SSLException: Tag mismatch!" before the API returns HTTP.
    tls-protocols: ${AI_TLS_PROTOCOLS:TLSv1.2}
  ai:
    api-url: ${AI_API_URL:${OPENAI_BASE_URL:https://api.flintic.uk}}
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:}}
    model: ${AI_MODEL:gpt-5.5}
    api-type: ${AI_API_TYPE:responses}
    fallback-api-type: ${AI_FALLBACK_API_TYPE:off}
    append-api-path: ${AI_APPEND_API_PATH:true}
    openai-auth-enabled: ${AI_OPENAI_AUTH_ENABLED:false}
    auth-header-type: ${AI_AUTH_HEADER_TYPE:none}
    actor-authorization: ${AI_ACTOR_AUTHORIZATION:local-image-extension}
    reasoning-effort: ${AI_REASONING_EFFORT:xhigh}
    disable-response-storage: ${AI_DISABLE_RESPONSE_STORAGE:true}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:16384}
    image-detail: ${AI_IMAGE_DETAIL:high}
    image:
      enabled: ${AI_IMAGE_ENABLED:true}
      base-url: ${AI_IMAGE_BASE_URL:${AI_API_URL:${OPENAI_BASE_URL:https://api.flintic.uk}}}
      api-key: ${AI_IMAGE_API_KEY:${AI_API_KEY:${OPENAI_API_KEY:}}}
      model: ${AI_IMAGE_MODEL:gpt-image-2}
      quality: ${AI_IMAGE_QUALITY:medium}
      timeout-seconds: ${AI_IMAGE_TIMEOUT_SECONDS:180}
