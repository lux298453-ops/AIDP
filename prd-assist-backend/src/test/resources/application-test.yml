# PostgreSQL 测试环境配置
# 注意: 运行测试前需确保本地 PostgreSQL 已启动，并创建 test 数据库:
#   CREATE DATABASE ai_document_test;
# 或使用 TestContainers 自动管理（需额外依赖）
spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/ai_document_test?currentSchema=public
    driver-class-name: org.postgresql.Driver
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:postgres123}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

app:
  jwt:
    secret: dGVzdFNlY3JldEtleUZvckpXVDIwMjRUZXN0aW5nUHVycG9zZXMxMjM0NTY3ODkwYWJjZGVm
    expiration-ms: 3600000
  upload:
    dir: test-uploads
  ai:
    api-url: https://api.example.com/v1/messages
    api-key: test-key
    model: test-model
